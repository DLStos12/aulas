<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        button{
            margin: auto;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div style="
        height:550px;
        width: 450px;
        border: 1px solid black;
        background-color: darkblue;
        ">
        <div style="
        height:100px;
        width: 80%;
        margin: auto;
        margin-top: 10px;
        border: 1px solid black;
        background-color: white;
        color: black;
        text-align: center;
        "
        >
            <h1>Saldo:1200</h1>
        </div>
        <div style="display: flex; width: 100%; margin-top: 20px;">
            <button>Saque</button>
            <button>Ver Saldo</button>
            <button>Depositar</button>
        </div>
        <div style="margin-top:20px; display: grid; width: 100%; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3,1fr); gap: 10px;">
            <button id="1">1</button>
            <button id="2">2</button>
            <button id="3">3</button>
            <button id="4">4</button>
            <button id="5">5</button>
            <button id="6">6</button>
            <button id="7">7</button>
            <button id="8">8</button>
            <button id="9">9</button>
            <button style="grid-column: 2;" id="0">0</button>
        </div>
    </div>
</body>
</html>
